# Kokoro TTS box — OpenAI-compatible speech endpoint on http://127.0.0.1:8880
# CPU image works everywhere (Mac, Linux, Windows). ~1 GB RAM, a sentence in ~1 s.
# For an NVIDIA box, swap the image to ghcr.io/remsky/kokoro-fastapi-gpu:latest
# and uncomment the deploy block.
services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: talking-computer-kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8880"   # loopback only — never expose TTS to the LAN
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
